/* ===== refino visual (mesmo estilo) ===== */

.card{border-radius:10px;border:1px solid var(--line);background:#ffffff12;transition:background .12s,border-color .12s}

/* ===== interface v2 (proposta "Extração — Interface e Menus") ===== */
:root{--cr:#fbbf24;--am:#2dd4bf;--rail:76px}

//  'pat'  patrulha: ninguém te viu; o líder anda entre pontos da zona e os outros seguem em cunha ou coluna (traveling)
//  'srch' busca: ouviram tiro, foram alertados ou te perderam de vista; vão ao último lugar onde te viram,

//  'ct'   contato: alguém te vê; cada inimigo usa a IA tática do tipo (enemies/ai.js), com lanços por esquadra (s.bh troca a cada 3–5 s)

function sqNew(x,z,o){return{m:[],ld:null,st:'pat',lx:x,lz:z,lt:-99,ht:-99,t:Math.random()*SQD.tick,bh:0,bt:L(SQD.bound[0],SQD.bound[1],Math.random()),

function sqMk(x,z,n,al,o){o=o||{};const s=sqNew(x,z,o);SQB=1;const tys=o.tys?o.tys.slice():[];if(!o.tys){for(let i=0;i<n;i++)tys.push(i==0&&n>=3?'sgt':pickE());if(n>=3)espPick(tys,o.sp)}

function espPick(tys,sp){const n=tys.length;let k=ESP.k[Math.min(n,ESP.k.length-1)];const sl=f=>{for(let i=1;i<n;i++)if(tys[i]=='')return i;for(let i=1;i<n;i++)if((f||tys[i]!='fly')&&!ESP.th[tys[i]])return i;return -1};

 const d=cfDef(),c={...SV.cf};for(const k in d){if(!(k in o))continue;const v=o[k],g=CFR[k];if(k=='lay'){if(v=='th'||v=='cl')c.lay=v}else if(typeof v=='number'&&isFinite(v))c[k]=g?cl(v,g[0],g[1]):v?1:0}
 SV.cf=c;save();applyCf();return true}
function cfgRe(){$('pz').style.display=='flex'?pzR():hub()}
function cfgExp(b){cpy(cfgTa(b),cfgCode(),b)}
function cfgImp(b){const t=cfgTa(b),v=t.value.replace('(copiado)','').trim();if(cfgLoad(v))cfgRe();else t.value='Código inválido: cole um código que comece com CFG1:'}
function cfgDef(){SV.cf=cfDef();save();applyCf();cfgRe()}

function uaRow(){return (SV.ars&&SV.ars.length?'<br>Arsenal atual: <b>'+arsTxt(SV.ars.filter(k=>TY[k]))+'</b> <small>(muda ao começar uma operação)</small>':'')
  +`<br><button id="uab" class="card nb" style="display:inline-block;width:auto;outline:${SV.ua?'2px solid #4ade80':'none'}" onclick="selUa()">Todas as armas (teste): ${SV.ua?'Ligado':'Desligado'}</button>`}
// Todas as armas (teste): enquanto ligado, todo tipo de arma conta como liberado (escolha, sorteio do arsenal, loot, lendárias), sem comprar no Laboratório.
// Ao desligar, volta ao que foi comprado: arma de partida e arsenal atual com arma não comprada voltam ao padrão (a operação em andamento mantém o arsenal dela).
function selUa(){SV.ua=SV.ua?0:1;if(!SV.ua){if(!wpUn(SV.arsP))SV.arsP=ARS.base[0];if((SV.ars||[]).some(k=>!wpUn(k)))SV.ars=arsRoll(SV.arsP)}save();fwr();if($('hub').style.display=='block'&&BT=='ars')hub('ars')}
// Corpo a corpo (ajuste de teste): slider + botões −/+ por valor; muda na hora, mesmo no meio da missão (fica salvo em SV.mt)
const MTL={sr:'Alcance da espada',sa:'Arco da espada',pr:'Alcance da lança',kr:'Alcance do chute',c2:'Combo: dano do 2º chute',c3:'Combo: dano do 3º chute (dois pés)',ca:'Combo: arco do 3º chute',cr:'Combo: alcance do 3º chute',cw:'Combo: tempo para emendar'},MTT={sr:'sword',pr:'spear',kr:'kick',cr:'kick'};
const mtTxt=k=>{const v=SV.mt[k],f=x=>x.toFixed(2).replace('.',',');if(k=='sa'||k=='ca')return v+'°';if(k=='c2'||k=='c3')return '×'+f(v)+' do dano';if(k=='cw')return v.toFixed(1).replace('.',',')+' s';if(k=='cr'){const r=TY.kick.range,m=x=>(x*v*SV.mt.kr).toFixed(1).replace('.',',');return '×'+f(v)+' → '+m(r[0])+'–'+m(r[1])+' m'}const r=TY[MTT[k]].range,m=x=>(x*v).toFixed(1).replace('.',',');return '×'+v.toFixed(2).replace('.',',')+' → '+m(r[0])+'–'+m(r[1])+' m'};
const mtSum=()=>`Espada ${mtTxt('sr')}, arco ${mtTxt('sa')} · Lança ${mtTxt('pr')} · Chute ${mtTxt('kr')} · Combo: 2º ×${SV.mt.c2.toFixed(2)}, 3º ×${SV.mt.c3.toFixed(2)}, arco ${SV.mt.ca}°, alcance ×${SV.mt.cr.toFixed(2)}, emendar ${SV.mt.cw.toFixed(1)} s`;
function mtHtml(){const b='class="card nb" style="display:inline-block;width:auto"';
 return '<b>Corpo a corpo (ajuste de teste)</b><div class="mt">'+Object.keys(MTL).map(k=>{const g=MELT[k];return`<div data-k="${k}"><span>${MTL[k]}: <b class="mv" style="display:inline">${mtTxt(k)}</b></span><br><button ${b} onclick="mtStep(this,-1)">−</button><span class="msl" onpointerdown="mtDrag(event,this)"><i style="width:${mtPct(k)}%"></i></span><button ${b} onclick="mtStep(this,1)">+</button></div>`}).join('')
  +`<small class="ms">${mtSum()}</small><br><button ${b} onclick="mtReset()">Corpo a corpo: voltar ao padrão</button></div>`}
function mtSet(el,v){const d=el.closest('[data-k]'),k=d.dataset.k,g=MELT[k];SV.mt[k]=cl(k=='sa'||k=='ca'?Math.round(+v):Math.round(+v/g[2])*g[2],g[0],g[1]);save();
 d.querySelector('.mv').textContent=mtTxt(k);d.querySelector('.msl i').style.width=mtPct(k)+'%';const s=d.parentNode.querySelector('.ms');if(s)s.textContent=mtSum()}
// slider próprio: lê o dedo com toApp (funciona também com a tela girada, em pé)
const mtPct=k=>{const g=MELT[k];return(SV.mt[k]-g[0])/(g[1]-g[0])*100};
function mtDrag(ev,el){ev.preventDefault();const k=el.closest('[data-k]').dataset.k,g=MELT[k],r=el.getBoundingClientRect(),a=toApp({clientX:r.left,clientY:r.top}),b=toApp({clientX:r.right,clientY:r.bottom}),x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x);
 const f=e=>{const t=cl((toApp(e).x-x0)/(x1-x0||1),0,1);mtSet(el,g[0]+t*(g[1]-g[0]))},up=()=>{removeEventListener('pointermove',f);removeEventListener('pointerup',up);removeEventListener('pointercancel',up)};
 f(ev);addEventListener('pointermove',f);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
function mtStep(el,s){const k=el.closest('[data-k]').dataset.k;mtSet(el,SV.mt[k]+s*MELT[k][2])}
function mtReset(){SV.mt=mtDef();save();cfgRe()}
// Tela de armas (doc 08), hoje o briefing da operação: abre ao começar uma Operação nova. O arsenal sorteado vale para a operação e continua nas missões
// avulsas (SV.ars) até começar a próxima operação. Escolhe 1 tipo liberado (arma de partida);
// ao confirmar, sorteia mais 2 entre os liberados (sem troca), mostra o arsenal e a missão começa.
let ARC_=null,ARST=0;
const arsTxt=a=>a.map((k,i)=>(i?'':'★')+TY[k].n).join(' · ');
const arsLg=a=>Object.keys(LEND).filter(k=>a.includes(LEND[k].ty)&&lgOk(k)).map(k=>LEND[k].n);
function arsCard(k,sel,ro){const L=wpUn(k),m=mstInfo(k),c=document.createElement('button');c.className='card ac'+(sel?' sel':'')+(L?'':' lk');c.dataset.k=k;
 c.innerHTML=`<b>${sel?'★ ':''}${TY[k].n}</b><span>${ARS.d[k]||''}</span>`+(L?`<small>Maestria Nv ${m.lv} · +${m.lv}% raridade</small><span class="mbar"><i style="width:${m.need?Math.round(m.x/m.need*100):100}%"></i></span>`:`<i>Bloqueada · Laboratório ◆ ${ARS.price[k]}</i>`);
 if(!ro)c.onclick=()=>{if(!L){LBT='wp';hub('lab');return}SV.arsP=k;save();armas(ARC_)};return c}
// Briefing da operação: mesmo layout do briefing da missão; à esquerda a operação e a ameaça, à direita a arma de partida.
// Depois de CONFIRMAR, o lado direito mostra o sorteio (cartões girando) e a operação começa
function armas(ctx){ARC_=ctx;BFC=null;if(endFin)endFin();if(!wpUn(SV.arsP))SV.arsP=ARS.base[0];vw('full');$('scr').classList.add('bf');$('st').style.borderColor='';$('st').textContent='OPERAÇÃO';$('sd').textContent='';
 const ro=!!ctx.a,lg=ro?arsLg(ctx.a):[],h=$('hub');h.onclick=null;
 h.innerHTML=bfHead('OPERAÇÃO',`Ameaça: pontos ×${nX(1+(SV.th-1)*.25)}`,ro?'':'armasBack()')+`<section class="bfs"><div class="bfl2"><div class="bfk bfm bfo"><b class="bfnm">3 missões seguidas</b><span>O equipamento passa de uma para a outra; a 3ª é o chefe. Intervalo na nave: loja, bancada e contrato.</span><small class="bfnt">Morrer encerra a operação. O arsenal vale também para as missões avulsas até a próxima operação.</small></div>${bfThr(ro)}</div>`
  +`<div class="bfk bfaw"><h4>${ro?'Arsenal sorteado':'Arma de partida'}</h4><span class="bfsd">${ro?`Arsenal: <b>${arsTxt(ctx.a)}</b>`+(lg.length?` · <small>Lendárias possíveis: ${lg.join(', ')}</small>`:''):`As outras ${ARS.n-1} do arsenal são sorteadas entre as liberadas.`}</span></div></section>`
  +`<footer class="bff">${ro?'<span class="bfsd">Toque para começar</span>':''}<button id="go" onclick="${ro?'armasGo()':'armasOk()'}">${ro?'COMEÇAR ›':'SORTEAR E INICIAR ›'}</button></footer>`;
 const g=document.createElement('div');g.className='ars'+(ro?' rv':'');
 if(ro)ctx.a.forEach((k,i)=>{const c=arsCard(k,i==0,1);if(i)c.style.animationDelay=(i*.18)+'s',c.classList.add('flip');g.appendChild(c)});else Object.keys(TY).forEach(k=>g.appendChild(arsCard(k,k==SV.arsP)));
 h.querySelector('.bfaw').appendChild(g);if(!ro)hint('arm')}
function armasBack(){ARC_=null;base(1)}
// sorteio + revelação curta (cartões girando); tocar em qualquer lugar começa na hora
function armasOk(){const ctx=ARC_;if(!ctx||ctx.a)return;const a=arsRoll(SV.arsP);ctx.a=a;snd('pick');armas(ctx);const h=$('hub');
 // o toque em CONFIRMAR não pode valer como "toque para começar": liga o atalho só depois deste evento
 setTimeout(()=>{if(ARC_===ctx)h.onclick=armasGo},0);clearTimeout(ARST);ARST=setTimeout(armasGo,1400);a.slice(1).forEach((k,i)=>setTimeout(()=>ARC_===ctx&&snd('tickc',1.3+i*.2),180+i*180))}
function armasGo(){clearTimeout(ARST);const ctx=ARC_;if(!ctx||!ctx.a)return;ARC_=null;const h=$('hub');h.onclick=null;vw('menu');
 if(ctx.op)startOp(ctx.a);else{ARSV=ctx.a;startM(ctx.id,ctx.ms,ctx.bi)}}

// ---- input.js ----
// Entrada: toque (analógico, olhar, gestos), mouse com captura, teclado e botões
function lockM(){try{const q=R.domElement.requestPointerLock();if(q&&q.catch)q.catch(()=>{if(!everL)noLock=true})}catch(_){noLock=true}}
document.addEventListener('pointerlockchange',()=>{plock=document.pointerLockElement==R.domElement;if(plock)everL=true;else if(everL&&st=='play')pause()});
document.addEventListener('pointerlockerror',()=>{if(!everL)noLock=true});
addEventListener('pointerdown',e=>{if(e.target.tagName=='BUTTON'||st!='play')return;const pt=toApp(e);
 if(e.pointerType=='mouse'){if(plock){if(e.button==0)mf=true;return}if(!noLock){lockM();return}if(!look)look={id:e.pointerId,x:pt.x,y:pt.y};return}
 if((pt.x<W/2)!=LH&&!stick)stick={id:e.pointerId,x:pt.x,y:pt.y,dx:0,dy:0};else if(!look){look={id:e.pointerId,x:pt.x,y:pt.y,sx:pt.x,sy:pt.y,t0:performance.now(),mv:0};if(SV.cf.lay=='th')ripples.push({x:pt.x,y:pt.y,t:.25})}});
addEventListener('pointermove',e=>{const pt=toApp(e);if(plock&&st=='play'){yaw-=e.movementX*C.sens*SV.cf.sens;pitch=cl(pitch-e.movementY*C.sens*SV.cf.sens*SV.cf.vy,-1.2,1.2);return}if(stick&&e.pointerId==stick.id){stick.dx=pt.x-stick.x;stick.dy=pt.y-stick.y;const dd=Math.hypot(stick.dx,stick.dy);if(SV.cf.lay=='th'&&!pc){const q=dd/SV.cf.dr;if(q>.6&&!stick.r1){stick.r1=1;vib([4])}if(q>.85&&!stick.r2){stick.r2=1;vib([6])}if(q<.5)stick.r1=stick.r2=0;if(dd>SV.cf.dr&&!stick.dd){stick.dd=1;doDash()}else if(dd<SV.cf.dr-25)stick.dd=0}}
 if(look&&e.pointerId==look.id){look.mv=Math.max(look.mv||0,Math.hypot(pt.x-look.sx,pt.y-look.sy));{const dx=pt.x-look.x,dy=pt.y-look.y,k=1+SV.cf.ac*Math.min(2,Math.hypot(dx,dy)/10);yaw-=dx*TS*k;pitch=cl(pitch-dy*TS*SV.cf.vy*k,-1.2,1.2)}look.x=pt.x;look.y=pt.y}});
const up=e=>{if(e.pointerType=='mouse')mf=false;if(stick&&e.pointerId==stick.id)stick=null;if(look&&e.pointerId==look.id){if(e.type=='pointerup'&&e.pointerType!='mouse'&&SV.cf.lay=='th'&&(look.mv||0)<12&&performance.now()-look.t0<SV.cf.tt)doJump();look=null}};
addEventListener('pointerup',up);
addEventListener('pointercancel',up);
const bf=$('bf');
bf.onpointerdown=()=>fire=true;
['pointerup','pointerleave','pointercancel'].forEach(n=>bf.addEventListener(n,()=>fire=false));
$('bp').onpointerdown=take;$('bsc').onpointerdown=scrap;$('bfu').onpointerdown=fuse;
$('ba').onpointerdown=e=>{auto=!auto;e.target.textContent='AUTO: '+(auto?'ON':'OFF')};
addEventListener('keydown',e=>{if(e.target.tagName=='TEXTAREA')return;keys[e.code]=1;if(e.code=='KeyE')take();if(e.code=='KeyX')scrap();if(e.code=='KeyG')fuse();if(e.code=='KeyQ')useCI();if(e.code=='KeyP'||e.code=='Escape'){st=='play'?pause():resume()}if(e.code=='KeyT'){auto=!auto;$('ba').textContent='AUTO: '+(auto?'ON':'OFF')}if(e.code=='KeyR'&&st=='play'&&reload<=0&&ammo<w.mag)reload=1.3;if(e.code=='Space'){e.preventDefault();doJump()}if(e.code=='ShiftLeft'||e.code=='ShiftRight')doDash()});
$('bi').onpointerdown=useCI;
$('bpz').onpointerdown=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
// campos de código: o toque longo abre o menu de copiar/colar
// iOS ignora user-scalable=no: sem isto, abrir os dois polegares (analógico + olhar) dá zoom de pinça na página
['gesturestart','gesturechange'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
addEventListener('contextmenu',e=>{if(e.target.tagName!='TEXTAREA')e.preventDefault()});
$('bj').onpointerdown=doJump;
$('bd').onpointerdown=doDash;
addEventListener('keyup',e=>keys[e.code]=0);
// Menus com a tela girada: arrastar rola no eixo do jogo (a rolagem nativa seguiria o eixo da tela)
let dsc=null;
['scr','pz'].forEach(id=>$(id).addEventListener('pointerdown',e=>{if(!ROT.on||e.target.tagName=='TEXTAREA')return;const el=$(id);dsc={el,id:e.pointerId,y:toApp(e).y,t:el.scrollTop,mv:0}},true));
addEventListener('pointermove',e=>{if(!dsc||e.pointerId!=dsc.id)return;const dy=toApp(e).y-dsc.y;dsc.mv=Math.max(dsc.mv,Math.abs(dy));if(dsc.mv>8)dsc.el.scrollTop=dsc.t-dy});
const dscEnd=e=>{if(!dsc||e.pointerId!=dsc.id)return;if(dsc.mv>8){const el=dsc.el,eat=ev=>{ev.stopPropagation();ev.preventDefault()};el.addEventListener('click',eat,true);setTimeout(()=>el.removeEventListener('click',eat,true),60)}dsc=null};
addEventListener('pointerup',dscEnd);

// ---- debug.js ----
// ===== GANCHOS DE TESTE =====
// Usados pelo robô de testes (skill extracao-robo-de-testes). Não mudam nada no jogo normal.
const DBG={
 start(m,bi,mods,seed){LV.next=seed||0;DBG._nv=null;startM(m,mods||[],bi);auto=true;fire=false},
 // próximo ponto do caminho a pé até (x,z): o robô contorna paredes em vez de andar em linha reta
 nav(x,z){return navNext(DBG._nv||(DBG._nv={t:0,gx:1e9,gz:1e9}),pos,x,z)},
 // resumo do nível atual
 level(){return{seed:LV.seed,ok:LV.ok,tries:LV.tries,walls:walls.length,zones:LV.zones.map(z=>z.arq),high:LV.high.length}},
 step(dt){if(st=='play')tick(dt)},
 // libera todo o Laboratório (testes de loot que contam com todos os efeitos, marcas e lendárias)
 labAll(){SV.lab={mk:{},fx:{},lg:{},core:1,kit:0};for(const k in MARCA)SV.lab.mk[k]=1;for(const k in EFX)SV.lab.fx[k]=1;for(const k in LEND)SV.lab.lg[k]=1;SV.lab.wp={};for(const k in TY)SV.lab.wp[k]=1},
 // fixa o arsenal ativo (sem sorteio nem limite) e a arma escolhida
 ars(l,p){ARSF=l.slice();ARSA=l.slice();SV.arsP=p||l[0]},
 mute(){snd=function(){};vib=function(){}},
 on,
 // movimento em direção de mundo (x,z), normalizada; null para parar
 move(x,z){if(x==null){stick=null;return}const l=Math.hypot(x,z);if(l<.05){stick=null;return}x/=l;z/=l;const f=x*-Math.sin(yaw)+z*-Math.cos(yaw),r=x*Math.cos(yaw)+z*-Math.sin(yaw);stick={x:0,y:0,dx:r*60,dy:-f*60}},
 // objetivo atual da missão (posição) ou null
 objective(){if(phase=='extract'&&ext)return ext.position;if(M=='hunt'&&tgt)return tgt.m.position;if(M=='sab'){let g=null,gd=1e9;E.forEach(e=>{if(e.gen&&!e.tac){const d=Math.hypot(e.m.position.x-pos.x,e.m.position.z-pos.z);if(d<gd){gd=d;g=e}}});return g&&g.m.position}if(M=='ret'&&item)return item.position;if(M=='hold'&&hz)return hz;if(M=='boss'){const B=E.find(e=>e.boss);return B&&B.m.position}return null},
 won(){return st=='end'&&$('st').textContent.includes('CONCL')}
};
window.DBG=DBG;

// ---- main.js ----
// Laço principal: pausa de impacto, câmera lenta, tremor só na câmera, e o passo de simulação
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(st=='play'){juiceFrame(dt,now);if(hs>0)hs-=dt;else{let d2=dt;if(slow>0){slow-=dt;d2*=J.slowmo}tick(d2)}}else shP=shY=shR=rk=0;
 cam.position.copy(pos);cam.rotation.set(pitch+shP+rk+mlP,yaw+shY+mlY,shR+mlR);cam.updateMatrixWorld();draw();ipSync();trpSync();rdr()}
// Um passo de simulação: cada sistema na mesma ordem de antes
function tick(dt){T+=dt;
 updatePlayer(dt);
 const dir=updateLock(dt);
 updateWeapon(dt,dir);
 updateEnemies(dt);
 updateVisuals(dt);
 updateTimers(dt);
 updateDrone(dt);
 updateBombs(dt);
 if(hp<=0)return end(false);
 if(updateMission(dt))return;
 updateNear();
 updateHUD()}
function updateTimers(dt){inv-=dt;spdT-=dt;ovT-=dt;fxTick(dt);buildTick(dt);kbTick(dt);meleeFx(dt);E.forEach(e=>{if(e.mk>0)e.mk-=dt})}
// Animações e efeitos que andam com o tempo de jogo
function updateVisuals(dt){
 E.forEach(e=>animBot(e,dt));shardTick(dt);bioTick(dt);if(FL.visible&&(flT-=dt)<=0)FL.visible=false;crates.forEach(c=>{c.b.material.opacity=c.w.r>=3?.35+.25*Math.sin(T*5):.35;c.m.rotation.y+=dt*.7;c.m.position.y=c.y0+.42+Math.sin(T*2.2+c.m.position.x)*.05});
 $('dm').style.opacity=Math.max(0,$('dm').style.opacity-dt*2.5);
 TRP.forEach(o=>{if(o.t>0&&(o.t-=dt)<=0)o.l.visible=false});
}
// início
applyCf();
// primeira vez (sem Treino no save): convite para o Treino; senão, a Base
if(SV.tut)base();else tutWel();
requestAnimationFrame(frame);
